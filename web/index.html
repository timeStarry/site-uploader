<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}}</title>
<style>
  :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#202124;background:#fafafa}
  body{min-height:100vh;margin:0;display:grid;place-items:center;text-align:center}
  main{width:min(680px,calc(100% - 40px));padding:48px 20px}
  h1{font-size:clamp(28px,5vw,44px);font-weight:650;letter-spacing:.02em;margin:0 0 18px}
  .domain{margin:0;color:#687078;font-size:17px;word-break:break-word}
  hr{border:0;border-top:1px solid #dfe3e6;margin:28px auto;width:min(420px,80%)}
  .count{margin:0;color:#3f464d;font-size:18px}
</style>
<main>
  <h1>{{.Title}}</h1>
  <p class="domain">{{.Domain}}</p>
  <hr>
  <p class="count">本站有 {{.Count}} 个可访问静态页面</p>
</main>
</html>
